<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\">
<meta name=\"apple-mobile-web-app-title\" content=\"文字倖存者\">
<link rel=\"manifest\" href=\"manifest.webmanifest\">
<script>
// 手機模式（遊戲裡設定 window.tsWantFullscreen）：點一下畫面就進入全螢幕、鎖橫向。
// 瀏覽器規定全螢幕只能在玩家點擊的當下要求，所以掛在 touchend / click 上。
// iPhone 的 Safari 不支援網頁全螢幕（這裡什麼都不會發生），要用「加入主畫面」。
window.tsWantFullscreen = false;
function tsFullscreen() {
	if (!window.tsWantFullscreen) return;
	var d = document;
	if (d.fullscreenElement || d.webkitFullscreenElement) return;
	var el = d.documentElement;
	var req = el.requestFullscreen || el.webkitRequestFullscreen;
	if (!req) return;
	try {
		var p = req.call(el, { navigationUI: \"hide\" });
		if (p && p.then) {
			p.then(function () {
				if (screen.orientation && screen.orientation.lock) screen.orientation.lock(\"landscape\").catch(function () {});
			}).catch(function () {});
		}
	} catch (e) {}
}
document.addEventListener(\"touchend\", tsFullscreen, true);
document.addEventListener(\"click\", tsFullscreen, true);
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
